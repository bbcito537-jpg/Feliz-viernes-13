<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Viernes 13 🌹</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:Georgia,serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}#top{margin-top:14px;text-align:center;text-shadow:0 2px 8px #000;font-size:clamp(15px,4vw,22px)}#bottom{margin-bottom:26px;display:flex;gap:12px;pointer-events:auto}button{border:1px solid #f7d4a6;background:#552c48e8;color:#fff;border-radius:16px;padding:13px 22px;font:600 17px Georgia;box-shadow:0 5px 20px #0008;touch-action:manipulation}#overlay{position:fixed;inset:0;background:#120e20c9;display:flex;align-items:center;justify-content:center;padding:20px}#panel{max-width:430px;text-align:center;background:linear-gradient(145deg,#3b2446,#181c36);border:2px solid #d9aa7b;border-radius:26px;padding:30px 23px;box-shadow:0 0 65px #ee92bd45}h1{font-size:32px;color:#ffe4ba;margin:8px 0 16px}p{line-height:1.6;font-size:18px}#overlay button{margin-top:12px;background:#925078}#hint{font-size:13px;opacity:.8;margin-top:10px}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="top">🌹 Viernes 13 · Flores <span id="count">0</span>/5</div><div id="bottom"><button id="left">◀</button><button id="right">▶</button></div></div><div id="overlay"><div id="panel"><div style="font-size:44px">🌙🌹✨</div><h1 id="heading">Un viernes 13 diferente</h1><p id="message">Jason tiene una misión muy especial: recoger cinco flores para preparar un ramo para su niña bonita.</p><button id="start">Comenzar ✨</button><div id="hint">Toca las flechas para caminar</div></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,dpr,ground;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.73}addEventListener('resize',resize);resize();
let state='intro',x=55,dir=0,collected=0,t=0,flowers=[],particles=[],music=false,audio;const overlay=document.getElementById('overlay'),count=document.getElementById('count');function reset(){x=55;collected=0;count.textContent='0';flowers=[.18,.34,.51,.67,.82].map((p,i)=>({x:p*W,got:false,color:['#ff8cb7','#ffe3a5','#dca8ff','#fa6d9a','#fff2c2'][i]}));particles=[];state='play';overlay.style.display='none';startMusic()}
document.getElementById('start').onclick=reset;function finish(){state='end';overlay.style.display='flex';document.getElementById('heading').textContent='Feliz viernes trece, mi niña bonita 🌹';document.getElementById('message').innerHTML='Hoy Jason te trae estas flores para recordarte algo sencillo: <b>hasta un viernes 13 se vuelve un día bonito cuando pienso en ti.</b><br><br>Con mucho cariño, para Bella. ❤️';document.getElementById('start').textContent='Volver a jugar 💐';document.getElementById('hint').textContent='Un pequeño regalo hecho para ti';for(let i=0;i<80;i++)particles.push({x:W/2,y:H*.42,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:90+Math.random()*60})}
function bind(id,n){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();dir=n;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(dir===n)dir=0})}bind('left',-1);bind('right',1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')dir=-1;if(e.key==='ArrowRight'||e.key==='d')dir=1});addEventListener('keyup',()=>dir=0);
function startMusic(){if(music)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();music=true;let notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23];let i=0;function play(){if(!music||audio.state==='closed')return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.055,audio.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.45);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.48);setTimeout(play,510)}play()}catch(e){}}
function flower(px,py,color,s=1){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.strokeStyle='#528c62';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-24);ctx.stroke();ctx.fillStyle='#4d9b68';ctx.beginPath();ctx.ellipse(-7,-9,8,4,-.5,0,7);ctx.fill();for(let a=0;a<6;a++){let th=a*Math.PI/3;ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(Math.cos(th)*8,-28+Math.sin(th)*8,7,5,th,0,7);ctx.fill()}ctx.fillStyle='#ffdd74';ctx.beginPath();ctx.arc(0,-28,5,0,7);ctx.fill();ctx.restore()}
function boy(px,py){ctx.save();ctx.translate(px,py+Math.sin(t*.09)*2);ctx.fillStyle='#23283f';ctx.fillRect(-11,-25,9,23);ctx.fillRect(3,-25,9,23);ctx.fillStyle='#f7e7ca';ctx.fillRect(-13,-5,13,5);ctx.fillRect(3,-5,13,5);ctx.fillStyle='#394b42';ctx.fillRect(-16,-57,32,36);ctx.fillStyle='#202b29';ctx.fillRect(-14,-82,28,11);ctx.fillStyle='#e7e3d5';ctx.fillRect(-12,-78,24,27);ctx.fillStyle='#a52f39';ctx.fillRect(-2,-77,4,10);ctx.fillRect(-10,-62,5,3);ctx.fillRect(5,-62,5,3);ctx.fillStyle='#24242a';ctx.fillRect(-9,-69,6,5);ctx.fillRect(3,-69,6,5);ctx.fillStyle='#737776';for(let i=0;i<3;i++){ctx.fillRect(-8+i*7,-57,2,2)}ctx.fillStyle='#d6a17f';ctx.fillRect(13,-49,8,21);ctx.restore()}
function bouquet(px,py){ctx.save();ctx.translate(px,py);ctx.fillStyle='#e9c4a2';ctx.beginPath();ctx.moveTo(-23,-23);ctx.lineTo(24,-23);ctx.lineTo(4,19);ctx.lineTo(-4,19);ctx.closePath();ctx.fill();for(let i=0;i<7;i++)flower((i-3)*7,-10-Math.abs(i-3)*2,['#ff7ca6','#ffe5ab','#e5b2ff'][i%3],.62);ctx.restore()}
function draw(){t++;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#17152e');sky.addColorStop(.7,'#4a3052');sky.addColorStop(1,'#86576c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe8bf';ctx.beginPath();ctx.arc(W*.78,H*.17,29,0,7);ctx.fill();for(let i=0;i<45;i++){let sx=(i*137.7)%W,sy=(i*79.9)%(ground-70);ctx.globalAlpha=.35+.5*Math.abs(Math.sin(t*.014+i));ctx.fillStyle='#fff1d4';ctx.fillRect(sx,sy,2,2)}ctx.globalAlpha=1;ctx.fillStyle='#2d3440';for(let i=0;i<12;i++){let bx=i*W/11-20,bh=35+(i*29)%85;ctx.fillRect(bx,ground-bh,W/13,bh)}ctx.fillStyle='#344b4c';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#47685c';ctx.fillRect(0,ground,W,12);for(let i=0;i<W;i+=25){ctx.fillStyle='#62816a';ctx.fillRect(i,ground+12+(i%3)*4,3,8)}if(state==='play'){x=Math.max(20,Math.min(W-20,x+dir*3.1));for(let f of flowers){if(!f.got&&Math.abs(x-f.x)<21){f.got=true;collected++;count.textContent=collected;for(let j=0;j<12;j++)particles.push({x:f.x,y:ground-35,vx:(Math.random()-.5)*3,vy:-Math.random()*4,life:35})}}if(collected===5){state='deliver';setTimeout(finish,1700)}}flowers.forEach(f=>{if(!f.got)flower(f.x,ground-5+Math.sin(t*.04+f.x)*3,f.color,1.15)});boy(x,ground);if(state==='deliver'||state==='end')bouquet(x+24,ground-49);if(state==='deliver'){ctx.font='bold 20px Georgia';ctx.textAlign='center';ctx.fillStyle='#fff0d3';ctx.fillText('¡Para ti, Bella! 💐',W/2,ground-130)}for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.life--;ctx.globalAlpha=Math.max(0,Math.min(1,p.life/35));ctx.fillStyle='#ff9fbd';ctx.font='19px serif';ctx.fillText('♥',p.x,p.y)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(draw)}draw();
</script></body></html>
